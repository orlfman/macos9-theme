<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  SPDX-License-Identifier: BSD-2-Clause
  Private session bus for install.sh's isolated Platinum Global Menu load
  check. It has no <servicedir>, so nothing is D-Bus activated: with the
  default session config the applet made the bus start
  xdg-desktop-portal-kde, kactivitymanagerd and ksecretd, which outlived
  dbus-run-session and wrote into the deleted probe home (AUDIT #322).
-->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
